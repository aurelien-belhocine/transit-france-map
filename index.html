            if (on) { _map.addLayer(layer); } else { _map.removeLayer(layer); }
        });
        btn.classList.toggle('off', !on);
        var eye = btn.querySelector('.legend-eye');
        if (eye) eye.className = (on ? 'fa fa-eye' : 'fa fa-eye-slash') + ' legend-eye';
    }
    // --- End layer filter logic ---

</script>
</html>
